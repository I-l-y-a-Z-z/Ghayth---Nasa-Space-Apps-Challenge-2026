registry_version: 1.1.0
reviewed_on: '2026-11-15'
purpose: Source inventory and qualified live implementation status; Part 1 fixture
  isolation preserved
use_in_part1_runtime: false
selection_values:
- primary
- fallback
- optional
- rejected
- unresolved
verification_note: 'Selection is independent of verification: a chosen source may
  still have untested pilot pixels or missing records. Documentation review is not
  field validation.'
sources:
- id: nasa_imerg_final
  name: GPM IMERG Final daily
  inputs:
  - historical_daily_rainfall
  selection: primary
  verification_status: documentation_reviewed_sample_pending
  source_url: https://doi.org/10.5067/GPM/IMERGDF/DAY/07
  version: GPM_3IMERGDF collection 07; retain actual V07B processing label separately
  geographic_coverage: Near-global; Morocco within documented footprint; individual
    plot/day validity untested
  temporal_coverage: Directory describes January 1998 onward, approximately 3.5 months
    behind acquisition; exact daily holdings to query
  spatial_resolution: 0.1 degree latitude/longitude, approximately 10 km
  temporal_resolution: daily UTC
  variables:
  - precipitation
  - precipitation_cnt
  - randomError
  units:
    precipitation: mm/day
    precipitation_cnt: count
    randomError: mm/day
  access: Earthdata HTTPS; Harmony/HOSS spatial and variable subsets; Giovanni area-averaged
    samples
  authentication: Free Earthdata Login for protected data
  usage_conditions: NASA data citation; preserve collection and subset lineage
  quality_filters:
  - Retain fill values and valid retrieval counts; zero rain is valid
  - Flag incomplete days; read units and scale attributes before conversion
  engine_use: Historical planting-window rain totals, documented rain-onset definitions
    and dry-spell exposure; not a weather forecast
  unresolved:
  - No Final-run scientific file supplied
  - Need native pixels, retrieval counts, multi-year coverage and independent local
    comparison
  documentation_urls:
  - https://gpm.nasa.gov/data/directory
  - https://doi.org/10.5067/GPM/IMERGDF/DAY/07
  - https://github.com/nasa/gesdisc-tutorials/blob/main/user-guidance/GES_DISC_Migration_to_Earthdata_Website_and_Earthdata_Cloud.md

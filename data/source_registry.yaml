- id: nasa_power_weather
  name: NASA POWER Daily meteorology and radiation
  inputs:
  - temperature
  - humidity
  - wind
  - solar_radiation
  selection: primary
  verification_status: local_sample_structure_checked
  source_url: https://power.larc.nasa.gov/docs/services/api/temporal/daily/
  version: POWER API v2.10.3 in supplied file; MERRA2, SYN1DEG and POWER source labels
  geographic_coverage: Global source grids; local point longitude -7.6 latitude 33.0
    checked
  temporal_coverage: Meteorology from 1981; local sample 2024-10-01 to 2024-10-31;
    variable coverage differs
  spatial_resolution: Meteorology 0.5 degree latitude by 0.625 degree longitude; radiation
    native source grid differs
  temporal_resolution: daily; use explicit UTC for comparisons
  variables:
  - T2M
  - T2M_MIN
  - T2M_MAX
  - RH2M
  - WS2M
  - ALLSKY_SFC_SW_DWN
  units:
    temperature: degC
    RH2M: percent
    WS2M: m/s
    ALLSKY_SFC_SW_DWN: MJ/m2/day in supplied AG response
  access: Public POWER Daily point API; cache by source cell and period
  authentication: No Earthdata Login or NASA API key required for public endpoint
  usage_conditions: Observe POWER service limits and attribution; avoid repeated requests
    for the same source cell
  quality_filters:
  - Honor header fill_value -999 and time_standard
  - All seven supplied parameters have 31 dates, no nulls or fill values
  - Keep near-real-time continuation provenance distinct from reanalysis
  engine_use: Historical heat/cold exposure and covariates; water-use modeling only
    after separately justified parameters
  unresolved:
  - One month does not establish a climatic baseline or field accuracy
  - Need multiyear series and geographically distinct samples
  documentation_urls:
  - https://power.larc.nasa.gov/docs/services/api/temporal/daily/
  - https://power.larc.nasa.gov/docs/methodology/data/sources_meteorology/

- id: isric_soilgrids
  name: ISRIC SoilGrids predictions
  inputs:
  - gridded_soil_properties
  selection: primary
  verification_status: documentation_reviewed_sample_pending
  source_url: https://docs.isric.org/globaldata/soilgrids/SoilGrids_faqs.html
  version: SoilGrids 2.0; pin exact downloaded release and tile identifiers
  geographic_coverage: Global modeled soils; local mask/gaps possible
  temporal_coverage: Static modeled release, not a current soil test
  spatial_resolution: 250 m
  temporal_resolution: static
  variables:
  - sand
  - silt
  - clay
  - phh2o
  - soc
  - bdod
  - depth_interval
  - mean
  - Q0.05
  - Q0.95
  units:
    texture: g/kg stored; divide by 10 for percent
    phh2o: pH times 10 stored; divide by 10
    soc: dg/kg stored; divide by 10 for g/kg
    bdod: cg/cm3 stored; divide by 100 for kg/dm3
    depths: 0–5,5–15,15–30,30–60,60–100,100–200 cm
  access: Prefer WCS spatial subsets or self-contained tiled GeoTIFF exports; REST
    beta documented as paused
  authentication: Public documented services
  usage_conditions: CC BY 4.0
  quality_filters:
  - Preserve depths, prediction quantiles, nodata and original scaling
  - Do not treat a remote-referencing VRT alone as an offline dataset
  engine_use: Texture/pH constraints with uncertainty; field measurements override
    only the properties and depths measured
  unresolved:
  - Need pilot subsets and scale conversion verification
  - No field-level certainty or measured salinity/nutrient sufficiency inferred
  documentation_urls:
  - https://docs.isric.org/globaldata/soilgrids/SoilGrids_faqs_01.html
  - https://docs.isric.org/globaldata/soilgrids/SoilGrids_faqs_02.html

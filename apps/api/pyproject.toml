[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agrix"
version = "1.0.0"
description = "Morocco farm planning with traceable Earth observations, historical climate replay and cash-flow scenarios"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.121,<1", "pydantic>=2.10,<3", "uvicorn>=0.32,<1",
  "SQLAlchemy>=2.0.36,<3", "alembic>=1.16,<2", "psycopg[binary]>=3.2,<4",
  "shapely>=2.0.6,<3", "pyproj>=3.7,<4", "PyYAML>=6.0.2,<7",
  "httpx>=0.28,<1", "xarray>=2024.6", "rasterio>=1.4,<2", "pyarrow>=18,<25",
  "scipy>=1.11,<2", "h5netcdf[h5py]>=1.4,<2",
  "zarr>=2.18,<3", "fsspec>=2024.6", "s3fs>=2024.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]
browser = ["playwright>=1.50,<2"]
earthdata = ["earthaccess>=0.14,<1"]
cloudflare = ["botocore>=1.36,<2"]

[project.scripts]
agrix = "agrix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agrix = ["fixtures/*.yaml", "fixtures/*.json", "static/*", "static/**/*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]


version: morocco-environment-screening-v2
reviewed_on: '2026-11-15'
references:
  - id: fao56-water-v1
    source_id: fao-irrigation-drainage-paper-56
    source_version: '1998; chapters 3, 6, 8; tables 12, 22'
    url: https://www.fao.org/4/x0490e/x0490e00.htm
    origin: observed
    topics: [water, temperature, soil]
    quality_notes:
      - FAO coefficients/rooting depths are generic reference conditions, not calibrated Moroccan parameters.
      - Temperature-only Hargreaves ET0 is a screening fallback requiring regional verification.
      - Dry faba, lentil, chickpea and cereal Kc values and depletion fractions follow tables 12 and 22.
  - id: environmental-screening-policy-v2
    source_id: agrix-explicit-environmental-screening-policy
    source_version: '2.0'
    origin: assumption
    topics: [duration, ranking, terrain, drought, vegetation]
    quality_notes:
      - Thermal targets, stage fractions, scoring weights and slope runoff sensitivity are transparent uncalibrated planning assumptions.
      - Species ecological temperature limits are not daily lethal thresholds or cultivar thermal bases.
      - Scores are comparative indices, not probabilities or predicted yields.
      - Soil storage is bracketed when initial moisture is unknown; surface moisture never initializes root-zone storage.
      - Historical mean NDVI informs bare-ground exposure only; it does not identify previous crops.
      - No observed moisture value is transplanted to a different historical date or future season.
    uncertainty: Local cultivar phenology, vernalization, photoperiod, soil hydraulics and runoff require validation.

  - &id002
    id: morocco-cereals-2017
    source_id: morocco-ministry-agriculture-cereal-reference
    source_version: 2237-N891-16c; 2017-05-29
    url: https://ardna.org/admincockpit/files/contenus_files/ticket_file641196ed6f8cc-N891-R%C3%A9f%C3%A9rentiel-c%C3%A9r%C3%A9ales-MEP-HB-29_05_2017-(final).pdf
    origin: observed
    topics:
    - sowing
    - predecessor
    - management
    quality_notes:
    - Moroccan Ministry/NOVEC technical reference. Printed pages 23 (crop requirements
      and barley cereal-predecessor exclusion), 39-41 (regional rotations), 43 (November
      to mid-December cereal sowing).
    - Regional rotation table applies to holdings below 5 ha; not generalized here
      as a mandatory rotation.
    - Soft wheat water requirement discussed in guide is not encoded as a rainfall-only
      feasibility threshold.
  - &id003
    id: morocco-planning-assumptions-v1
    source_id: agrix-explicit-planning-assumptions
    source_version: '1.0'
    origin: assumption
    topics:
    - duration
    - management
    - fallow
    quality_notes:
    - Nominal crop durations and operation dates are scheduling assumptions, not validated
      cultivar phenology.
    - Operation costs, yields, prices, labor quantities and local machinery access
      are missing until farmer inputs/quotes are supplied.
    - Zero catalog price/yield values are schema placeholders with budget_yield_status=missing;
      never use as economic observations.
    - Fallow is an explicit occupancy interval; no assumed disease, fertility or profit
      effect.
    uncertainty: Requires farmer/agronomist confirmation of cultivar, harvest date
      and management; no calibrated yield response.
  - &id004
    id: morocco-pilot-region-lookup-v1
    source_id: agrix-conservative-pilot-region-lookup
    source_version: '1.0'
    origin: assumption
    topics:
    - geography
    quality_notes:
    - Small approximate lookup extents within named Moroccan source regions; not official
      administrative/agroecological boundaries.
    - Whole-plot containment is required. Every matched extent remains partial, requiring
      local region confirmation.
    - 'Source regions: cereal reference printed page 43; legume guide printed page
      8.'
